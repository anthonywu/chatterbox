[project]
name = "chatterbox-tts"
version = "0.1.6"
description = "Chatterbox: Open Source TTS and Voice Conversion by Resemble AI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "resemble-ai", email = "engineering@resemble.ai"}
]
dependencies = [
    "numpy>=1.24.0,<3.0",
    "librosa>=0.11.0,<1.0.0",
    "s3tokenizer",
    "torch>=2.6.0,<3.0.0",
    "torchaudio>=2.6.0,<3.0.0",
    "transformers>=4.46.3,<5.0.0",
    "diffusers>=0.29.0,<1.0.0",
    "resemble-perth>=1.0.1,<2.0.0",
    "conformer>=0.3.2,<1.0.0",
    "safetensors>=0.5.3,<1.0.0",
    "spacy-pkuseg>=0.0.25,<1.0",
    "pyloudnorm>=0.1.1,<1.0",
    "omegaconf>=2.3.0,<3.0",
    "pykakasi>=2.3.0,<3.0.0",
    "gradio>=5.44.1,<6.0.0",
]

[project.optional-dependencies]
ru = [
    "russian-text-stresser @ git+https://github.com/Vuizur/add-stress-to-epub",
]

[project.urls]
Homepage = "https://github.com/resemble-ai/chatterbox"
Repository = "https://github.com/resemble-ai/chatterbox"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
